name: Quality

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint (ESLint + Stylelint)
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit, component and database tests
        run: npm test -- --run
      - name: Duplicated code
        run: npm run lint:dupes
