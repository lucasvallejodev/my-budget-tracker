<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How left to spend is worked out</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #eb6c36; --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', 'Noto Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Waterfall · Diagram Design</p>
    <h1>How left to spend is worked out</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="research-left-to-spend-title research-left-to-spend-desc">
      <title id="research-left-to-spend-title">How left to spend is worked out</title>
      <desc id="research-left-to-spend-desc">Waterfall chart for an example month in euros, on the 19th with 12 days left: income of 2,400 EUR, received and expected, minus 950 EUR of bills still due, 780 EUR reserved for budgets (the limit or the amount spent, whichever is larger), 120 EUR of spending without a budget and 300 EUR of goal contributions leaves 250 EUR to spend, about 20.83 EUR a day.</desc>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Y-axis title -->
      <text transform="rotate(-90 24 260)" x="24" y="260" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em" text-anchor="middle">EUR · THIS MONTH</text>

      <!-- Gridlines. Domain 0 to 2,500 EUR, y = 440 − 0.144·v -->
      <line x1="80" y1="368" x2="920" y2="368" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="296" x2="920" y2="296" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="224" x2="920" y2="224" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="152" x2="920" y2="152" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="80" x2="920" y2="80" stroke="rgba(45,49,66,0.06)" stroke-width="0.8"/>

      <!-- Axes -->
      <line x1="80" y1="80" x2="80" y2="440" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <line x1="80" y1="440" x2="920" y2="440" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>

      <!-- Y-axis ticks -->
      <text x="72" y="372" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">500</text>
      <text x="72" y="300" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">1,000</text>
      <text x="72" y="228" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">1,500</text>
      <text x="72" y="156" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">2,000</text>
      <text x="72" y="84" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">2,500</text>

      <!-- Carries: running total 2,400 → 1,450 → 670 → 550 → 250 -->
      <line x1="196" y1="94" x2="236" y2="94" stroke="rgba(45,49,66,0.55)" stroke-width="1" data-carry="2400"/>
      <line x1="332" y1="231" x2="372" y2="231" stroke="rgba(45,49,66,0.55)" stroke-width="1" data-carry="1450"/>
      <line x1="468" y1="344" x2="508" y2="344" stroke="rgba(45,49,66,0.55)" stroke-width="1" data-carry="670"/>
      <line x1="604" y1="361" x2="644" y2="361" stroke="rgba(45,49,66,0.55)" stroke-width="1" data-carry="550"/>
      <line x1="740" y1="404" x2="780" y2="404" stroke="rgba(45,49,66,0.55)" stroke-width="1" data-carry="250"/>

      <!-- Bars (width 96, pitch 136) -->
      <!-- Income: total 2,400, y(2400) = 94.4 -->
      <rect x="100" y="94" width="96" height="346" fill="#f5f5f5"/>
      <rect x="100" y="94" width="96" height="346" fill="rgba(45,49,66,0.08)" stroke="#2d3142" stroke-width="1" data-role="total" data-value="2400" data-name="Income"/>
      <text x="148" y="86" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">2,400 EUR</text>

      <!-- Bills still due: −950, 2,400 → 1,450 -->
      <rect x="236" y="94" width="96" height="137" fill="#f5f5f5"/>
      <rect x="236" y="94" width="96" height="137" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1" data-role="delta" data-value="-950" data-name="Bills still due"/>
      <text x="284" y="243" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">−950</text>

      <!-- Budgets reserved: −780, 1,450 → 670 -->
      <rect x="372" y="231" width="96" height="113" fill="#f5f5f5"/>
      <rect x="372" y="231" width="96" height="113" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1" data-role="delta" data-value="-780" data-name="Budgets reserved"/>
      <text x="420" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">−780</text>

      <!-- Spending without a budget: −120, 670 → 550 -->
      <rect x="508" y="344" width="96" height="17" fill="#f5f5f5"/>
      <rect x="508" y="344" width="96" height="17" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1" data-role="delta" data-value="-120" data-name="Spending without a budget"/>
      <text x="556" y="373" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">−120</text>

      <!-- Goal contributions: −300, 550 → 250 -->
      <rect x="644" y="361" width="96" height="43" fill="#f5f5f5"/>
      <rect x="644" y="361" width="96" height="43" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1" data-role="delta" data-value="-300" data-name="Goal contributions"/>
      <text x="692" y="416" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">−300</text>

      <!-- Left to spend FOCAL: total 250 = 2400 − 950 − 780 − 120 − 300 -->
      <rect x="780" y="404" width="96" height="36" fill="#f5f5f5"/>
      <rect x="780" y="404" width="96" height="36" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1.4" data-role="total" data-value="250" data-name="Left to spend"/>
      <text x="828" y="396" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">250 EUR</text>

      <!-- Callout -->
      <text x="920" y="300" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="end">≈ 20.83 EUR a day for the 12 days left</text>
      <path d="M 868 310 Q 880 356 864 400" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="864" cy="402" r="2" fill="#2d3142"/>

      <!-- Category labels -->
      <text x="148" y="460" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Income</text>
      <text x="148" y="474" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">received + expected</text>

      <text x="284" y="460" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bills still due</text>

      <text x="420" y="460" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Budgets reserved</text>
      <text x="420" y="474" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">limit or spent,</text>
      <text x="420" y="486" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">whichever is larger</text>

      <text x="556" y="460" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Spending without</text>
      <text x="556" y="474" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">a budget</text>

      <text x="692" y="460" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Goal contributions</text>

      <text x="828" y="460" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Left to spend</text>

      <!-- Legend -->
      <line x1="40" y1="520" x2="920" y2="520" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="536" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="548" width="16" height="10" rx="2" fill="rgba(45,49,66,0.08)" stroke="#2d3142" stroke-width="1"/>
      <text x="64" y="557" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Month income</text>

      <rect x="180" y="548" width="16" height="10" rx="2" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/>
      <text x="204" y="557" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Already committed</text>

      <rect x="340" y="548" width="16" height="10" rx="2" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="364" y="557" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Left to spend</text>

      <text x="920" y="557" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em" text-anchor="end">EXAMPLE MONTH IN EUR · TODAY IS THE 19TH, 12 DAYS LEFT</text>
    </svg>
  </div>
</body>
</html>
