<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaction lifecycle</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #eb6c36; --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', 'Noto Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · Lifecycle phase map · Diagram Design</p>
    <h1>Transaction lifecycle: from capture to reconciliation</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tx-lifecycle-title tx-lifecycle-desc">
      <title id="tx-lifecycle-title">Transaction lifecycle: from capture to reconciliation</title>
      <desc id="tx-lifecycle-desc">Lifecycle phase map with Captured, Posted, Cleared and Reconciled on the primary rail; a Needs review wait state for entries without a category or an unmatched transfer leg; and Deleted and Discarded as terminal outcomes.</desc>
      <defs>
        <marker id="lc-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
        <marker id="lc-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Bands -->
      <rect x="24" y="44" width="912" height="120" rx="8" fill="rgba(79,93,117,0.035)" stroke="rgba(45,49,66,0.12)"/>
      <rect x="24" y="372" width="912" height="112" rx="8" fill="rgba(45,49,66,0.035)" stroke="rgba(45,49,66,0.12)"/>
      <text x="40" y="64" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">WAIT / REVIEW</text>
      <text x="40" y="204" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">PRIMARY PHASES</text>
      <text x="40" y="388" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">TERMINAL OUTCOMES</text>

      <!-- Transitions (drawn before states) -->
      <line x1="40" y1="256" x2="64" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lc-arrow)"/>
      <line x1="214" y1="256" x2="264" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lc-arrow)"/>
      <path d="M 139,220 V 184 Q 139,176 147,176 H 182 Q 190,176 190,168 V 140" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lc-arrow)"/>
      <line x1="304" y1="140" x2="304" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lc-arrow)"/>
      <line x1="280" y1="220" x2="280" y2="140" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#lc-arrow)"/>
      <line x1="414" y1="256" x2="464" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lc-arrow)"/>
      <line x1="614" y1="256" x2="664" y2="256" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#lc-arrow-accent)"/>
      <line x1="339" y1="292" x2="339" y2="404" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lc-arrow)"/>
      <line x1="139" y1="292" x2="139" y2="404" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lc-arrow)"/>

      <!-- Transition labels: opaque masks, 6–10px clear of the stroke -->
      <g font-family="'Geist Mono',monospace" font-size="7" text-anchor="middle" letter-spacing="0.08em" fill="#4f5d75">
        <rect x="27" y="238" width="32" height="12" rx="2" fill="#f5f5f5"/><text x="43" y="247">NEW</text>
        <rect x="215" y="238" width="48" height="12" rx="2" fill="#f5f5f5"/><text x="239" y="247">COMPLETE</text>
        <rect x="147" y="196" width="58" height="12" rx="2" fill="#f5f5f5"/><text x="176" y="205">NO CATEGORY</text>
        <rect x="312" y="196" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="340" y="205">CATEGORIZE</text>
        <rect x="232" y="196" width="40" height="12" rx="2" fill="#f5f5f5"/><text x="252" y="205">REOPEN</text>
        <rect x="421" y="238" width="36" height="12" rx="2" fill="#f5f5f5"/><text x="439" y="247">CLEARS</text>
        <rect x="623" y="238" width="32" height="12" rx="2" fill="#f5f5f5"/><text x="639" y="247" fill="#eb6c36">MATCH</text>
        <rect x="347" y="336" width="40" height="12" rx="2" fill="#f5f5f5"/><text x="367" y="345">DELETE</text>
        <rect x="147" y="336" width="52" height="12" rx="2" fill="#f5f5f5"/><text x="173" y="345">DUPLICATE</text>
      </g>

      <!-- Start pseudo-state -->
      <circle cx="34" cy="256" r="6" fill="#2d3142"/>

      <!-- Primary rail -->
      <g font-family="'Geist',sans-serif" text-anchor="middle">
        <g><rect x="64" y="220" width="150" height="72" rx="8" fill="#fff" stroke="#2d3142"/><text x="139" y="251" fill="#2d3142" font-size="12" font-weight="600">Captured</text><text x="139" y="270" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">manual or imported</text></g>
        <g><rect x="264" y="220" width="150" height="72" rx="8" fill="#fff" stroke="#2d3142"/><text x="339" y="251" fill="#2d3142" font-size="12" font-weight="600">Posted</text><text x="339" y="270" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">in ledger · balances</text></g>
        <g><rect x="464" y="220" width="150" height="72" rx="8" fill="#fff" stroke="#2d3142"/><text x="539" y="251" fill="#2d3142" font-size="12" font-weight="600">Cleared</text><text x="539" y="270" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">bank confirmed</text></g>
        <g><rect x="664" y="220" width="150" height="72" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/><circle cx="688" cy="244" r="7" fill="none" stroke="#eb6c36"/><circle cx="688" cy="244" r="4" fill="#eb6c36"/><text x="739" y="251" fill="#2d3142" font-size="12" font-weight="600">Reconciled</text><text x="739" y="270" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">statement matched · locked</text></g>
      </g>

      <!-- Wait / review state -->
      <g text-anchor="middle">
        <g><rect x="164" y="68" width="150" height="72" rx="8" fill="#f5f5f5" stroke="#4f5d75" stroke-dasharray="5,4"/><rect x="174" y="78" width="34" height="12" rx="2" fill="none" stroke="rgba(79,93,117,0.45)"/><text x="191" y="87" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace">WAIT</text><text x="239" y="111" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif">Needs review</text><text x="239" y="126" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">no category · unmatched leg</text></g>
      </g>

      <!-- Terminal outcomes -->
      <g text-anchor="middle">
        <g><rect x="64" y="404" width="150" height="72" rx="8" fill="rgba(45,49,66,0.04)" stroke="#4f5d75" stroke-width="1.5" stroke-dasharray="3,3"/><rect x="74" y="414" width="54" height="12" rx="2" fill="none" stroke="rgba(79,93,117,0.45)"/><text x="101" y="423" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace">TERMINAL</text><text x="139" y="447" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif">Discarded</text><text x="139" y="462" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">duplicate · never posted</text></g>
        <g><rect x="264" y="404" width="150" height="72" rx="8" fill="rgba(45,49,66,0.04)" stroke="#4f5d75"/><rect x="274" y="414" width="54" height="12" rx="2" fill="none" stroke="rgba(79,93,117,0.45)"/><text x="301" y="423" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace">TERMINAL</text><text x="339" y="447" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif">Deleted</text><text x="339" y="462" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">soft delete · sums reverse</text></g>
      </g>

      <!-- Legend strip -->
      <line x1="40" y1="524" x2="920" y2="524" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="540" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="556" width="14" height="10" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="60" y="564" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Primary phase</text>

      <rect x="150" y="556" width="14" height="10" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="170" y="564" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Happy completion (locked)</text>

      <rect x="316" y="556" width="14" height="10" rx="3" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="336" y="564" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Wait / review</text>

      <rect x="420" y="556" width="14" height="10" rx="3" fill="rgba(45,49,66,0.04)" stroke="#4f5d75" stroke-width="1"/>
      <text x="440" y="564" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Terminal outcome</text>

      <line x1="540" y1="562" x2="568" y2="562" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lc-arrow)"/>
      <text x="576" y="564" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Transition</text>

      <line x1="648" y1="562" x2="676" y2="562" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#lc-arrow)"/>
      <text x="684" y="564" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Reopen when its category is archived</text>
    </svg>
  </div>
</body>
</html>
