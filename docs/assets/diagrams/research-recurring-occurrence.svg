<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="research-recurring-occurrence-title research-recurring-occurrence-desc">
      <title id="research-recurring-occurrence-title">What happens to each expected bill</title>
      <desc id="research-recurring-occurrence-desc">Lifecycle of one occurrence of a recurring bill: Upcoming becomes Due when its date arrives, Due becomes Paid when a transaction matches (directly, after the user confirms an auto-created pending row, or late from Overdue), Due becomes Overdue when the match window passes, and Due or Overdue can be Skipped by the user; Paid and Skipped close the occurrence.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="ro-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
        <marker id="ro-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Bands -->
      <rect x="24" y="24" width="912" height="116" rx="8" fill="#4f5d75" fill-opacity="0.035" stroke="#2d3142" stroke-opacity="0.12"/>
      <rect x="24" y="348" width="240" height="136" rx="8" fill="#2d3142" fill-opacity="0.035" stroke="#2d3142" stroke-opacity="0.12"/>
      <rect x="288" y="348" width="648" height="136" rx="8" fill="#4f5d75" fill-opacity="0.035" stroke="#2d3142" stroke-opacity="0.12"/>
      <text x="40" y="44" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">WAIT / REVIEW</text>
      <text x="40" y="188" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">PRIMARY PHASES</text>
      <text x="40" y="368" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">TERMINAL OUTCOME</text>
      <text x="304" y="368" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LATE / RECOVERY</text>

      <!-- Transitions (drawn before states) -->
      <line x1="46" y1="236" x2="72" y2="236" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ro-arrow)"/>
      <line x1="232" y1="236" x2="312" y2="236" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ro-arrow)"/>
      <line x1="472" y1="236" x2="712" y2="236" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#ro-arrow-accent)"/>
      <path d="M 392,200 V 180 Q 392,172 400,172 H 548 Q 556,172 556,164 V 128" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ro-arrow)"/>
      <path d="M 628,128 V 164 Q 628,172 636,172 H 784 Q 792,172 792,180 V 200" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ro-arrow)"/>
      <line x1="420" y1="272" x2="420" y2="392" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ro-arrow)"/>
      <path d="M 364,272 V 308 Q 364,316 356,316 H 160 Q 152,316 152,324 V 392" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ro-arrow)"/>
      <line x1="312" y1="428" x2="232" y2="428" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ro-arrow)"/>
      <path d="M 472,428 H 784 Q 792,428 792,420 V 272" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ro-arrow)"/>

      <!-- Transition labels: opaque masks, 6-10px clear of the stroke -->
      <g font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle" letter-spacing="0.06em" fill="#4f5d75">
        <rect x="236" y="218" width="72" height="12" rx="2" fill="#f5f5f5"/><text x="272" y="227">DATE REACHED</text>
        <rect x="566" y="218" width="52" height="12" rx="2" fill="#f5f5f5"/><text x="592" y="227" fill="#eb6c36">MATCHED</text>
        <rect x="438" y="150" width="68" height="12" rx="2" fill="#f5f5f5"/><text x="472" y="159">AUTO-CREATE</text>
        <rect x="668" y="150" width="80" height="12" rx="2" fill="#f5f5f5"/><text x="708" y="159">USER CONFIRMS</text>
        <rect x="430" y="326" width="80" height="12" rx="2" fill="#f5f5f5"/><text x="470" y="335">WINDOW PASSED</text>
        <rect x="226" y="298" width="64" height="12" rx="2" fill="#f5f5f5"/><text x="258" y="307">USER SKIPS</text>
        <rect x="240" y="410" width="64" height="12" rx="2" fill="#f5f5f5"/><text x="272" y="419">USER SKIPS</text>
        <rect x="596" y="410" width="64" height="12" rx="2" fill="#f5f5f5"/><text x="628" y="419">LATE MATCH</text>
      </g>

      <!-- Start pseudo-state -->
      <circle cx="40" cy="236" r="6" fill="#2d3142"/>

      <!-- Primary rail -->
      <g font-family="'Geist',sans-serif" text-anchor="middle">
        <g><rect x="72" y="200" width="160" height="72" rx="8" fill="#ffffff" stroke="#2d3142"/><text x="152" y="231" fill="#2d3142" font-size="12" font-weight="600">Upcoming</text><text x="152" y="250" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace">before its date</text></g>
        <g><rect x="312" y="200" width="160" height="72" rx="8" fill="#ffffff" stroke="#2d3142"/><text x="392" y="231" fill="#2d3142" font-size="12" font-weight="600">Due</text><text x="392" y="250" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace">date ± 3 days window</text></g>
        <g><rect x="712" y="200" width="160" height="72" rx="8" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36"/><circle cx="736" cy="224" r="7" fill="none" stroke="#eb6c36"/><circle cx="736" cy="224" r="4" fill="#eb6c36"/><text x="792" y="231" fill="#2d3142" font-size="12" font-weight="600">Paid</text><text x="792" y="250" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace">transaction matched</text></g>
      </g>

      <!-- Wait / review state -->
      <g text-anchor="middle">
        <g><rect x="492" y="56" width="200" height="72" rx="8" fill="#f5f5f5" stroke="#4f5d75" stroke-dasharray="5,4"/><rect x="502" y="66" width="34" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.45"/><text x="519" y="75" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace">WAIT</text><text x="592" y="99" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif">Pending in review inbox</text><text x="592" y="116" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace">pending row to confirm</text></g>
      </g>

      <!-- Late / recovery state -->
      <g text-anchor="middle">
        <g><rect x="312" y="392" width="160" height="72" rx="8" fill="#ffffff" stroke="#2d3142"/><rect x="322" y="402" width="34" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.45"/><text x="339" y="411" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace">LATE</text><text x="392" y="435" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif">Overdue</text><text x="392" y="452" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace">no match in window</text></g>
      </g>

      <!-- Terminal outcome -->
      <g text-anchor="middle">
        <g><rect x="72" y="392" width="160" height="72" rx="8" fill="#2d3142" fill-opacity="0.04" stroke="#4f5d75"/><circle cx="96" cy="416" r="7" fill="none" stroke="#4f5d75"/><circle cx="96" cy="416" r="4" fill="#4f5d75"/><text x="152" y="435" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif">Skipped</text><text x="152" y="452" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace">not this time</text></g>
      </g>

      <!-- Legend strip -->
      <line x1="40" y1="508" x2="920" y2="508" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="40" y="528" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <text x="920" y="528" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em" text-anchor="end">EXAMPLE: NETFLIX, 12.99 EUR, MONTHLY ON THE 5TH · MATCH WINDOW ± 3 DAYS</text>

      <circle cx="45" cy="549" r="5" fill="#2d3142"/>
      <text x="56" y="552" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Start</text>

      <rect x="100" y="544" width="14" height="10" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="120" y="552" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Phase</text>

      <rect x="170" y="544" width="14" height="10" rx="3" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="190" y="552" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Waits for the user</text>

      <rect x="292" y="544" width="14" height="10" rx="3" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <text x="312" y="552" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Paid, the goal state</text>

      <circle cx="430" cy="549" r="5" fill="none" stroke="#4f5d75"/>
      <circle cx="430" cy="549" r="2.5" fill="#4f5d75"/>
      <text x="442" y="552" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Terminal: the occurrence is closed</text>

      <line x1="608" y1="549" x2="636" y2="549" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ro-arrow)"/>
      <text x="644" y="552" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Only when the series creates pending rows</text>
    </svg>
