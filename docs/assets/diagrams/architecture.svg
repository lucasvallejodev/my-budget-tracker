      <path d="M 232,272 H 184" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <path d="M 408,248 H 424 Q 432,248 432,240 V 192 Q 432,184 440,184 H 456" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
