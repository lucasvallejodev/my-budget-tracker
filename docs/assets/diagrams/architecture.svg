<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="app-arch-title app-arch-desc">
      <title id="app-arch-title">Budget tracker · application architecture</title>
      <desc id="app-arch-desc">Architecture diagram showing the Next.js client calling server actions and route handlers, which delegate to a ledger service, a catalog service and a reports service backed by PostgreSQL through Drizzle, with Clerk for authentication and a pluggable exchange-rate provider.</desc>
