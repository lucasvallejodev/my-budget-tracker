# SonarQube Cloud project settings. The scan runs from .github/workflows/sonar.yml.
# Organization and project keys come from the SonarQube Cloud project page (see docs/getting-started/setup.md).
sonar.organization=lucasvallejodev
sonar.projectKey=lucasvallejodev_my-budget-tracker
sonar.projectName=CoinKeeper

sonar.sources=apps/web/src,apps/web/scripts,packages/shared/src,scripts
sonar.tests=apps/web/src,packages/shared/src,e2e
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,e2e/**
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.module.scss.d.ts
sonar.cpd.exclusions=**/src/constants/icons.ts,**/src/constants/icon-names.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.json,apps/web/tsconfig.json,packages/shared/tsconfig.json
sonar.sourceEncoding=UTF-8
